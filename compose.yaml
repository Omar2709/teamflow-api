services:
  web:
    build:
      context: .
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      DB_HOST: host.docker.internal
      CELERY_BROKER_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:8.10.0-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  celery-worker:
    build:
      context: .
    command:
      - celery
      - -A
      - config
      - worker
      - --loglevel=INFO
    env_file:
      - .env
    environment:
      DB_HOST: host.docker.internal
      CELERY_BROKER_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy

  celery-beat:
    build:
      context: .
    command:
      - celery
      - -A
      - config
      - beat
      - --loglevel=INFO
    env_file:
      - .env
    environment:
      DB_HOST: host.docker.internal
      CELERY_BROKER_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy